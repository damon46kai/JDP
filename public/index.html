<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Jane Doe's Pegboard • 工具墙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🧩 Jane Doe's Pegboard</h1>
    <p class="subtitle">Your personal tool wall • 私人工具黄页</p>

    <!-- 添加工具表单 -->
    <div class="card form-card">
      <input id="name" placeholder="工具名称" required>
      <input id="url" placeholder="网址链接" required>
      <input id="category" placeholder="分类：开发 / AI / 设计 / 效率">
      <textarea id="desc" placeholder="简单描述"></textarea>
      <button onclick="addTool()">Add to Pegboard</button>
    </div>

    <!-- 工具墙 -->
    <div id="toolWall" class="tool-wall"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
